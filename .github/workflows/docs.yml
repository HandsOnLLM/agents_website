name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # uv.lock pins zensical exactly. Zensical is pre-1.0 and ships breaking
      # changes, so the build must never float to a newer version.
      - name: Install dependencies
        run: uv sync --frozen

      # Image derivatives under docs/images/ are generated from art/ by
      # scripts/optimize_images.py and checked in, so the build is just a build.
      - name: Build
        run: uv run zensical build --clean

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - uses: actions/deploy-pages@v4
        id: deployment
