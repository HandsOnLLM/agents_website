[project]
site_name = "An Illustrated Guide to AI Agents"
site_url = "https://ai-agents-book.com/"
site_description = "With more than 300 custom illustrations, explore the fundamentals of AI agents in An Illustrated Guide to AI Agents."
site_author = "Maarten Grootendorst & Jay Alammar"
copyright = "Copyright &copy; 2026 Maarten Grootendorst &amp; Jay Alammar"

repo_url = "https://github.com/HandsOnLLM/An-Illustrated-Guide-To-AI-Agents"
repo_name = "HandsOnLLM/An-Illustrated-Guide-To-AI-Agents"

extra_css = [
  "stylesheets/theme.css",
  "stylesheets/home.css",
]

extra_javascript = [
  { path = "javascripts/scroll-animations.js", type = "module" },
]

nav = [
  { "Reviews" = "#reviews" },
  { "About the Book" = "#about" },
  { "Table of Contents" = "#chapters" },
  { "About the Authors" = "#authors" },
]

[project.plugins.search]
enabled = false

[project.theme]
custom_dir = "overrides"
language = "en"
logo = "images/logo.svg"
favicon = "images/favicon.svg"

features = [
  "announce.dismiss",
  "content.code.annotate",
  "content.code.copy",
  "content.tabs.link",
  "content.tooltips",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "navigation.sections",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "toc.follow",
]

[project.theme.font]
text = "Figtree"
code = "JetBrains Mono"

# Colours are defined as CSS custom properties in stylesheets/theme.css,
# sampled from the book's own figures. See the "custom" values below.
[project.theme.palette]
scheme = "default"
primary = "custom"
accent = "custom"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/HandsOnLLM/An-Illustrated-Guide-To-AI-Agents"
name = "The code on GitHub"

[[project.extra.social]]
icon = "fontawesome/brands/amazon"
link = "https://www.amazon.com/Illustrated-Guide-AI-Agents-Concepts/dp/B0GTYL2QSJ"
name = "Buy on Amazon"

[project.extra]
# Buy link, referenced from templates so it lives in one place.
amazon_url = "https://www.amazon.com/Illustrated-Guide-AI-Agents-Concepts/dp/B0GTYL2QSJ"
generator = false

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
