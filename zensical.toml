[project]
site_name = "An Illustrated Guide to AI Agents"
site_url = "https://www.agents-book.com/"
site_description = "Build an AI agent from scratch in pure Python. The companion site for An Illustrated Guide to AI Agents by Maarten Grootendorst and Jay Alammar, with 300+ custom figures."
site_author = "Maarten Grootendorst & Jay Alammar"
copyright = "Copyright &copy; 2026 Maarten Grootendorst &amp; Jay Alammar"

repo_url = "https://github.com/HandsOnLLM/An-Illustrated-Guide-To-AI-Agents"
repo_name = "HandsOnLLM/An-Illustrated-Guide-To-AI-Agents"

extra_css = [
  "stylesheets/theme.css",
  "stylesheets/home.css",
]

extra_javascript = [
  { path = "javascripts/terminal.js", type = "module" },
]

nav = [
  { "Home" = "index.md" },
  { "The Book" = [
    "book/index.md",
    "book/chapter-01.md",
    "book/chapter-02.md",
    "book/chapter-03.md",
    "book/chapter-04.md",
    "book/chapter-05.md",
    "book/chapter-06.md",
    "book/chapter-07.md",
    "book/chapter-08.md",
    "book/chapter-09.md",
    "book/chapter-10.md",
  ] },
  { "TinyAgent" = [
    "tinyagent/index.md",
    "setup/index.md",
  ] },
  { "Resources" = [
    "figures/index.md",
    "glossary.md",
    "bibliography.md",
  ] },
]

[project.theme]
custom_dir = "overrides"
language = "en"
logo = "images/logo.svg"
favicon = "images/favicon.svg"

features = [
  "announce.dismiss",
  "content.code.annotate",
  "content.code.copy",
  "content.tabs.link",
  "content.tooltips",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "navigation.sections",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "search.suggest",
  "toc.follow",
]

[project.theme.font]
text = "Figtree"
code = "JetBrains Mono"

# Colours are defined as CSS custom properties in stylesheets/theme.css,
# sampled from the book's own figures. See the "custom" values below.
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/HandsOnLLM/An-Illustrated-Guide-To-AI-Agents"
name = "The code on GitHub"

[[project.extra.social]]
icon = "fontawesome/solid/book"
link = "https://www.oreilly.com/library/view/an-illustrated-guide/9798341662681/"
name = "Read on O'Reilly"

[[project.extra.social]]
icon = "fontawesome/brands/amazon"
link = "https://www.amazon.com/Illustrated-Guide-AI-Agents-Concepts/dp/B0GTYL2QSJ"
name = "Buy on Amazon"

[project.extra]
# Buy links, referenced from templates so they live in one place.
oreilly_url = "https://www.oreilly.com/library/view/an-illustrated-guide/9798341662681/"
amazon_url = "https://www.amazon.com/Illustrated-Guide-AI-Agents-Concepts/dp/B0GTYL2QSJ"
repo_book = "https://github.com/HandsOnLLM/An-Illustrated-Guide-To-AI-Agents"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
